<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Luopan 3D Pro - Advanced Feng Shui Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        html, body { height: 100%; }
        body { font-family: 'Prompt', sans-serif; background-color: #020617; color: white; overflow: hidden; touch-action: none; margin: 0; padding: 0; }
        /* ใช้ 100dvh เพื่อไม่ให้แถบที่อยู่ของเบราว์เซอร์มือถือบังจอ (เบราว์เซอร์เก่าใช้ 100vh) */
        #canvas3dContainer { width: 100%; height: 100vh; height: 100dvh; position: absolute; top: 0; left: 0; z-index: 1; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .glass-panel { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .layer-btn.active { background: rgba(30, 41, 59, 0.9); border-color: #d4af37; color: #fde047; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        input[type="range"] { accent-color: #d4af37; }
        
        #sidebar {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
            opacity: 0;
            box-shadow: none;
        }
        #sidebar.open {
            transform: translateX(0);
            opacity: 1;
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }

        #videoBackground {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;
            object-fit: cover; z-index: 0; display: none;
        }

        /* ===== Responsive layout =====
           JS (layoutUI) คำนวณขนาดจานให้พอดีจอ แล้วส่งค่ามาเป็นตัวแปร CSS:
           --deg-bottom : ระยะจากขอบล่างถึงขอบบนของจาน (กล่ององศาวางชิดเหนือจาน)
           --side-w     : ความกว้างช่องว่างข้างจาน (ใช้ในจอแนวนอน)
           --side-top   : ตำแหน่งใต้ปุ่มลอย (ใช้ในจอแนวนอน) */
        #fabLeft, #fabRight { top: calc(clamp(60px, 8vh, 100px) + env(safe-area-inset-top, 0px)); }
        #fabLeft { left: max(clamp(16px, 4vw, 32px), env(safe-area-inset-left, 0px)); }
        #fabRight { right: max(clamp(16px, 4vw, 32px), env(safe-area-inset-right, 0px)); }
        #toastNotification { top: calc(20px + env(safe-area-inset-top, 0px)); }

        /* จอแนวตั้ง: กล่ององศาอยู่เหนือจาน กล่องสถานะอยู่ใต้จาน */
        #degreeDisplay {
            top: auto;
            bottom: var(--deg-bottom, calc(100% - clamp(75px, 11vh, 120px) - 80px));
            left: 50%;
            transform: translateX(-50%);
            /* แคบพอไม่ให้ไปทับปุ่มลอยซ้าย-ขวา */
            width: calc(100% - 2 * (clamp(16px, 4vw, 32px) + clamp(48px, 12vmin, 64px) + 10px));
            max-width: 500px;
        }
        #degreeDisplay #dirAdvice { max-width: 100%; }
        #statusBadgeWrapper {
            bottom: calc(clamp(95px, 14vh, 150px) + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 550px;
        }
        #manualRotationControl { bottom: calc(clamp(16px, 3vh, 32px) + env(safe-area-inset-bottom, 0px)); }

        /* จอแนวนอน (มือถือแนวนอน แท็บเล็ตแนวนอน เดสก์ท็อป): ย้ายกล่องไปไว้ข้างจาน */
        body.side-layout #degreeDisplay {
            top: var(--side-top, 180px); bottom: auto;
            left: calc(var(--side-w, 260px) / 2 + env(safe-area-inset-left, 0px) / 2);
            width: calc(var(--side-w, 260px) - 32px); max-width: 440px;
        }
        body.side-layout #degreeDisplay .deg-arrow { display: none; }
        body.side-layout #dirAdvice { order: 2; margin: 12px 0 0; width: 100%; max-width: 100%; }
        body.side-layout #degreeBox { width: 100%; }
        body.side-layout #statusBadgeWrapper {
            top: var(--side-top, 180px); bottom: auto;
            left: calc(100% - var(--side-w, 260px) / 2 - env(safe-area-inset-right, 0px) / 2);
            width: calc(var(--side-w, 260px) - 32px); max-width: 440px;
        }
        body.side-layout #manualRotationControl {
            left: auto; right: env(safe-area-inset-right, 0px);
            width: var(--side-w, 260px); padding-left: 16px; padding-right: 16px;
        }
        body.side-layout #manualRotationControl input { max-width: 100%; }
        /* จอเตี้ยมาก (มือถือแนวนอน): ลดขนาดตัวอักษรในกล่องสถานะ */
        @media (max-height: 480px) {
            body.side-layout #statusBadge { padding: 8px 12px; }
            body.side-layout #statusBadge span, body.side-layout #statusBadge div { font-size: 12px !important; }
            body.side-layout #manualRotationControl label { display: none; }
        }
        /* iPhone จะซูมหน้าจอเองถ้าช่องกรอกตัวอักษรเล็กกว่า 16px */
        @media (max-width: 767px) {
            #sidebar input[type="datetime-local"], #sidebar select { font-size: 16px; }
        }
        #sidebar { padding-left: env(safe-area-inset-left, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        .cn-char { font-family: 'STKaiti', 'KaiTi', 'SimKai', serif; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }
    </style>
</head>
<body>
    <video id="videoBackground" autoplay playsinline></video>
    <div id="canvas3dContainer"></div>

    <div id="uiLayer" class="flex flex-col h-full w-full">
        <div id="toastNotification" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800/95 text-white px-5 py-2.5 rounded-full shadow-2xl backdrop-blur-md font-semibold text-[clamp(12px,3vmin,16px)] transition-all duration-300 opacity-0 pointer-events-none scale-90 flex items-center gap-2 border border-slate-600/50">
            <span id="toastMessage" class="whitespace-nowrap">แจ้งเตือน</span>
        </div>

        <!-- Floating Buttons (Left): ปรับขนาดปุ่มให้รองรับ Tablet -->
        <div id="fabLeft" class="absolute top-[clamp(60px,8vh,100px)] left-[clamp(16px,4vw,32px)] z-30 flex flex-col gap-[clamp(12px,2vh,20px)] pointer-events-auto">
            <button id="menuBtn" class="bg-slate-900/95 border-2 border-slate-700 text-yellow-500 p-[clamp(8px,2vmin,16px)] rounded-2xl shadow-lg hover:bg-slate-800 transition-all flex items-center justify-center w-[clamp(48px,12vmin,64px)] h-[clamp(48px,12vmin,64px)]">
                <svg class="w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <button id="quickLayerBtn" class="bg-slate-900/95 border-2 border-indigo-500 text-indigo-400 p-[clamp(8px,2vmin,16px)] rounded-2xl shadow-lg hover:bg-slate-800 transition-all flex items-center justify-center w-[clamp(48px,12vmin,64px)] h-[clamp(48px,12vmin,64px)]" title="สลับโหมดหน้าปัด">
                <svg class="w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
            </button>
        </div>

        <!-- Floating Buttons (Right): ปรับขนาดปุ่มให้รองรับ Tablet -->
        <div id="fabRight" class="absolute top-[clamp(60px,8vh,100px)] right-[clamp(16px,4vw,32px)] z-30 flex flex-col gap-[clamp(12px,2vh,20px)] pointer-events-auto">
            <button id="compassBtn" class="bg-indigo-600/95 text-white p-[clamp(8px,2vmin,16px)] rounded-full shadow-lg border-2 border-indigo-400 hover:bg-indigo-500 transition-all flex items-center justify-center w-[clamp(48px,12vmin,64px)] h-[clamp(48px,12vmin,64px)]">
                <svg class="w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
            <button id="arBtn" class="bg-slate-800/95 text-emerald-400 p-[clamp(8px,2vmin,16px)] rounded-full shadow-lg border-2 border-slate-600 hover:bg-slate-700 transition-all flex items-center justify-center w-[clamp(48px,12vmin,64px)] h-[clamp(48px,12vmin,64px)]">
                <svg class="w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>

        <div id="sidebar" class="absolute top-0 left-0 w-full md:w-[28rem] lg:w-[32rem] max-w-[95vw] h-full glass-panel z-40 flex flex-col pointer-events-auto shadow-2xl">
            <div class="flex-shrink-0 bg-slate-900/95 p-4 pt-12 md:pt-4 border-b border-slate-700/80 flex justify-between items-center z-10">
                <h1 class="text-lg md:text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-500 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Luopan 3D Pro
                </h1>
                <button id="closeSidebarBtn" class="text-slate-400 hover:text-white p-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="flex-shrink-0 flex border-b border-slate-700/80 bg-slate-900/50">
                <button class="tab-btn flex-1 py-3.5 text-[13px] font-medium text-yellow-400 border-b-2 border-yellow-500 transition-colors" data-tab="config">⚙️ ตั้งค่า (Config)</button>
                <button class="tab-btn flex-1 py-3.5 text-[13px] font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-colors" data-tab="analysis">📊 วิเคราะห์ (Analysis)</button>
            </div>

            <div id="tab-config" class="p-4 space-y-5 flex-1 overflow-y-auto">
                <div class="bg-slate-800/40 rounded-xl p-4 border border-slate-700/50">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-[13px] font-semibold text-yellow-500 flex items-center gap-1.5">🕒 กาลเวลาจร (Time)</label>
                        <button id="setNowBtn" class="text-[11px] bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded transition-colors">เวลาปัจจุบัน</button>
                    </div>
                    <input type="datetime-local" id="targetDate" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2.5 text-sm text-white focus:border-yellow-500 focus:outline-none mb-4">
                    
                    <div class="text-[11px] text-slate-400 mb-2 font-medium">เปิดเช็คข้อมูลทิศร้ายกาลเวลา:</div>
                    <div class="grid grid-cols-2 gap-2 text-[12px]">
                        <label class="flex items-center gap-2 bg-slate-900/60 px-3 py-2 rounded-lg border border-slate-700 cursor-pointer"><input type="checkbox" id="togYear" checked class="rounded border-slate-600 bg-slate-800 w-4 h-4"> <span>ปี (Year)</span></label>
                        <label class="flex items-center gap-2 bg-slate-900/60 px-3 py-2 rounded-lg border border-slate-700 cursor-pointer"><input type="checkbox" id="togMonth" checked class="rounded border-slate-600 bg-slate-800 w-4 h-4"> <span>เดือน (Month)</span></label>
                        <label class="flex items-center gap-2 bg-slate-900/60 px-3 py-2 rounded-lg border border-slate-700 cursor-pointer"><input type="checkbox" id="togDay" checked class="rounded border-slate-600 bg-slate-800 w-4 h-4"> <span>วัน (Day)</span></label>
                        <label class="flex items-center gap-2 bg-slate-900/60 px-3 py-2 rounded-lg border border-slate-700 cursor-pointer"><input type="checkbox" id="togHour" checked class="rounded border-slate-600 bg-slate-800 w-4 h-4"> <span>ยาม (Hour)</span></label>
                    </div>
                </div>

                <div class="bg-slate-800/40 rounded-xl p-4 border border-slate-700/50">
                    <label class="block text-[13px] font-semibold text-yellow-500 mb-3 flex items-center gap-1.5">👤 ข้อมูลบุคคล (Person)</label>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">วัน/เดือน/ปีเกิด และเวลา</label>
                            <input type="datetime-local" id="birthDate" value="1981-06-25T10:16" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2.5 text-sm text-white focus:border-yellow-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">เพศ (Gender)</label>
                            <select id="gender" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2.5 text-sm text-white focus:border-yellow-500 focus:outline-none">
                                <option value="M">ชาย (Male)</option>
                                <option value="F" selected>หญิง (Female)</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between bg-slate-900/80 px-4 py-3 rounded-lg border border-slate-700 mt-2">
                            <span class="text-[12px] text-slate-300">รหัสบุคคล (Kua Number):</span>
                            <span id="kuaDisplay" class="text-xl font-bold text-yellow-400 bg-slate-800 w-10 h-10 flex items-center justify-center rounded-full border border-yellow-500/50 shadow-inner">8</span>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800/40 rounded-xl p-4 border border-slate-700/50">
                    <label class="block text-[13px] font-semibold text-blue-400 mb-3 flex items-center gap-1.5">🗺️ แปลนบ้าน (Floor Plan)</label>
                    <div class="space-y-3">
                        <input type="file" id="fpInput" accept="image/*" class="hidden">
                        <button id="fpBtn" class="w-full bg-blue-600/80 hover:bg-blue-500 text-white text-[12px] py-2.5 rounded-lg border border-blue-500 transition-colors flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            อัปโหลดรูปแปลนบ้าน
                        </button>
                        
                        <div id="fpControls" class="hidden space-y-3 pt-2 border-t border-slate-700/80 mt-3">
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-400 mb-1"><span>ขนาด (Scale)</span><span id="fpScaleVal">1.0x</span></label>
                                <input type="range" id="fpScale" min="0.1" max="5" step="0.1" value="1" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                            </div>
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-400 mb-1"><span>ความโปร่งใส (Opacity)</span><span id="fpOpacityVal">50%</span></label>
                                <input type="range" id="fpOpacity" min="0" max="1" step="0.05" value="0.5" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                            </div>
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-400 mb-1"><span>หมุนองศา (Rotation)</span><span id="fpRotationVal">0°</span></label>
                                <input type="range" id="fpRotation" min="-180" max="180" step="1" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                            </div>
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-400 mb-1"><span>เลื่อนซ้าย-ขวา (Pan X)</span><span id="fpOffsetXVal">0.0</span></label>
                                <input type="range" id="fpOffsetX" min="-10" max="10" step="0.1" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                            </div>
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-400 mb-1"><span>เลื่อนขึ้น-ลง (Pan Y)</span><span id="fpOffsetYVal">0.0</span></label>
                                <input type="range" id="fpOffsetY" min="-10" max="10" step="0.1" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                            </div>
                            <div class="flex gap-2 mt-2">
                                <button id="fpResetBtn" class="flex-1 bg-slate-700/50 hover:bg-slate-600/80 text-slate-300 text-[11px] py-2 rounded-lg border border-slate-600/50 transition-colors">
                                    รีเซ็ตค่า
                                </button>
                                <button id="fpRemoveBtn" class="flex-1 bg-red-900/50 hover:bg-red-800/80 text-red-300 text-[11px] py-2 rounded-lg border border-red-700/50 transition-colors">
                                    ลบแปลน
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800/40 rounded-xl p-4 border border-slate-700/50">
                    <label class="block text-[13px] font-semibold text-emerald-400 mb-3 flex items-center gap-1.5">🎯 ปรับแต่งจานหล่อแก</label>
                    <div class="space-y-3">
                        <div>
                            <label class="flex justify-between text-[10px] text-slate-400 mb-1"><span>ขนาดจาน (Scale)</span><span id="luopanScaleVal">1.0x</span></label>
                            <input type="range" id="luopanScale" min="0.5" max="3" step="0.1" value="1" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="flex justify-between text-[10px] text-slate-400 mb-1"><span>ความโปร่งใสจาน (Opacity)</span><span id="luopanOpacityVal">100%</span></label>
                            <input type="range" id="luopanOpacity" min="0.1" max="1" step="0.05" value="1" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>

                <div class="space-y-2 pb-8 mt-4">
                    <label class="block text-[12px] font-medium text-slate-300 border-b border-slate-700 pb-1">โหมดแสดงผลหน้าปัด (View Mode)</label>
                    <div class="flex flex-col gap-2 pt-2">
                        <button class="layer-btn active px-4 py-3 bg-slate-800 border border-yellow-600 text-yellow-400 rounded-xl text-[13px] font-medium text-left transition-all flex items-center gap-2.5" data-layer="TIME"><span class="text-red-400 text-lg">🕒</span> แสดงทิศร้ายกาลเวลา (Afflictions)</button>
                        <button class="layer-btn px-4 py-3 bg-slate-900 border border-slate-700 text-slate-400 hover:bg-slate-800 rounded-xl text-[13px] font-medium text-left transition-all flex items-center gap-2.5" data-layer="KUA"><span class="text-emerald-400 text-lg">👤</span> เฉพาะทิศมงคลบุคคล (8 Mansions)</button>
                        <button class="layer-btn px-4 py-3 bg-slate-900 border border-slate-700 text-slate-400 hover:bg-slate-800 rounded-xl text-[13px] font-medium text-left transition-all flex items-center gap-2.5" data-layer="STARS"><span class="text-blue-400 text-lg">⭐</span> เฉพาะดาวเหิน (Flying Stars)</button>
                        <button class="layer-btn px-4 py-3 bg-slate-900 border border-slate-700 text-slate-400 hover:bg-slate-800 rounded-xl text-[13px] font-medium text-left transition-all flex items-center gap-2.5" data-layer="64GUA"><span class="text-indigo-400 text-lg">☯️</span> ผัง 64 ข่วย (Xuan Kong Da Gua)</button>
                    </div>
                </div>
            </div>

            <div id="tab-analysis" class="p-3 md:p-4 hidden flex-1 h-full overflow-hidden flex flex-col md:flex-row gap-3">
                <div class="flex flex-col gap-3 w-full md:w-1/2 overflow-y-auto shrink-0 md:shrink">

        // ค่าในอาร์เรย์คือเลขลำดับ King Wen (1–64) ใช้หาตัวอักษร Unicode (U+4DC0 + n - 1) และข้อความใน gua64Info
        const FUXI_RING = [24,27,3,42,51,21,17,25,36,22,63,37,55,30,49,13,19,41,60,61,54,38,58,10,11,26,5,9,34,14,43,1,

        // ตรีโกณก่อนฟ้า (先天) เริ่มจากทิศเหนือตามเข็มนาฬิกา: 坤 เหนือ, 震 อีสาน, 離 ตะวันออก, 兌 อาคเนย์, 乾 ใต้, 巽 หรดี, 坎 ตะวันตก, 艮 พายัพ
        const EARLY_HEAVEN_TRIGRAMS = ['☷', '☳', '☲', '☱', '☰', '☴', '☵', '☶'];

        // ลองจิจูดสุริยะ (องศา) ใช้หาวัน 立春 (315°) เมื่อโหลด Lunar.js ไม่ได้
        function sunLongitude(date) {
            const n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
            const L = 280.460 + 0.9856474 * n;
            const g = (357.528 + 0.9856003 * n) * Math.PI / 180;
            return (((L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360) + 360) % 360;
        }
        // ปีฮวงจุ้ย: เปลี่ยนปีที่เวลา 立春 จริง (ไม่ใช่ 1 ม.ค. หรือ 4 ก.พ. ตายตัว)
        function solarYearOf(date, yearBranchFromBazi) {
            const y = date.getFullYear();
            if (yearBranchFromBazi !== undefined && yearBranchFromBazi >= 0) {
                return (((y - 4) % 12) + 12) % 12 === yearBranchFromBazi ? y : y - 1;
            }
            const lon = sunLongitude(date);
            return (date.getMonth() < 3 && lon >= 270 && lon < 315) ? y - 1 : y;
        }

        function getManualDayPillar(dt) {
            const y = dt.getFullYear();
            const m = dt.getMonth() + 1;
            const d = dt.getDate();
            let jy = y, jm = m;
            if (jm <= 2) { jy -= 1; jm += 12; }
            let a = Math.floor(jy / 100);
            let b = 2 - a + Math.floor(a / 4);
            let jd = Math.floor(365.25 * (jy + 4716)) + Math.floor(30.6001 * (jm + 1)) + d + b - 1524.5;
            let dayIndex = (Math.floor(jd + 0.5) - 11) % 60;
            if (dayIndex < 0) dayIndex += 60;
            return { gan: dayIndex % 10, zhi: dayIndex % 12 };
        }

        function getPillarsFallback(dt) {
            const y = solarYearOf(dt);
            const yBranch = (((y - 4) % 12) + 12) % 12;
            const mBranch = (dt.getMonth() + 1) % 12; 
            const dData = getManualDayPillar(dt);
            const hour = dt.getHours();
            const hBranch = Math.floor((hour + 1) % 24 / 2) % 12;
            
            return {
                year: yBranch, month: mBranch, day: dData.zhi, hour: hBranch, solarYear: y,
                bazi: { yg: 0, yz: yBranch, mg: 0, mz: mBranch, dg: dData.gan, dz: dData.zhi, hg: 0, hz: hBranch }
            };
        }

        function getExactPillars(dt) {
            try {
                if (typeof Solar !== 'undefined' && typeof Lunar !== 'undefined') {
                    const solar = Solar.fromDate(dt);
                    const lunar = solar.getLunar();
                    const bazi = lunar.getEightChar();
                    // Lunar.js ถือว่าเวลาที่ส่งเข้าไปเป็นเวลาจีน (UTC+8) แต่ไทยเป็น UTC+7
                    // เสาปี/เดือน (ตัดที่เวลาสารทจริง) จึงต้องแปลงเป็นเวลาจีนก่อน ไม่งั้นคลาด 1 ชั่วโมง
                    // ส่วนเสาวัน/ยาม ใช้เวลาท้องถิ่นตามเดิม
                    const chinaWallClock = new Date(dt.getTime() + dt.getTimezoneOffset() * 60000 + 8 * 3600000);
                    const baziCN = Solar.fromDate(chinaWallClock).getLunar().getEightChar();

                    const yGanZhiStr = baziCN.getYear();
                    const mGanZhiStr = baziCN.getMonth();
                    const dGanZhiStr = bazi.getDay();
                    const hGanZhiStr = bazi.getTime();

                    const stemsArr = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
                    const branchesArr = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
                    
                    const getZhiIdx = (str) => branchesArr.indexOf(str.charAt(1));
                    const getGanIdx = (str) => stemsArr.indexOf(str.charAt(0));

                    return {
                        year: getZhiIdx(yGanZhiStr), month: getZhiIdx(mGanZhiStr), day: getZhiIdx(dGanZhiStr), hour: getZhiIdx(hGanZhiStr),
                        solarYear: solarYearOf(dt, getZhiIdx(yGanZhiStr)),
                        bazi: {
                            yg: getGanIdx(yGanZhiStr), yz: getZhiIdx(yGanZhiStr), 
                            mg: getGanIdx(mGanZhiStr), mz: getZhiIdx(mGanZhiStr), 
                            dg: getGanIdx(dGanZhiStr), dz: getZhiIdx(dGanZhiStr), 
                            hg: getGanIdx(hGanZhiStr), hz: getZhiIdx(hGanZhiStr) 
                        }
                    };
                }
            } catch (e) { 
                console.error("BaZi calculation failed, using fallback.", e);
            }
            return getPillarsFallback(dt);
        }

        function calculateAll() {
            state.date = new Date(els.targetDate.value); 
            state.birthDate = new Date(els.birthDate.value); 
            state.gender = els.gender.value;
            
            state.calc.timeBazi = getExactPillars(state.date);
            state.calc.personBazi = getExactPillars(state.birthDate);

            // Kua ใช้ปีฮวงจุ้ยของวันเกิด (คนเกิดก่อน 立春 นับเป็นปีก่อนหน้า)
            const by = state.calc.personBazi.solarYear;
            let sum = by.toString().split('').reduce((a, b) => a + parseInt(b), 0);
            while (sum > 9) sum = sum.toString().split('').reduce((a, b) => a + parseInt(b), 0);
            let kua = state.gender === 'M' ? 11 - sum : 4 + sum;
            if (kua > 9) kua -= 9; if (kua === 5) kua = state.gender === 'M' ? 2 : 8;
            state.calc.kua = kua; els.kuaDisplay.innerText = kua;

            const kuaGroups = { east: [1, 3, 4, 9], west: [2, 6, 7, 8] }; 
            const dirGroups = { east: ['N', 'S', 'E', 'SE'], west: ['W', 'NW', 'SW', 'NE'] };
            const group = kuaGroups.east.includes(kua) ? 'east' : 'west';
            state.calc.auspiciousDirs = dirGroups[group]; 
            state.calc.inauspiciousDirs = dirGroups[group === 'east' ? 'west' : 'east'];

            const getAffliction = (branchIdx) => {
                const clash = (branchIdx + 6) % 12; // 180 degrees opposite
                const trines = [[8,0,4], [11,3,7], [2,6,10], [5,9,1]];
                let ssStart = 0, ssEnd = 0, ssName = '';
                if(trines[0].includes(branchIdx)) { ssStart = 135; ssEnd = 225; ssName = 'ใต้'; } 
                else if(trines[1].includes(branchIdx)) { ssStart = 225; ssEnd = 315; ssName = 'ตะวันตก'; } 
                else if(trines[2].includes(branchIdx)) { ssStart = 315; ssEnd = 45; ssName = 'เหนือ'; } 
                else if(trines[3].includes(branchIdx)) { ssStart = 45; ssEnd = 135; ssName = 'ตะวันออก'; } 
                return { clash, ssStart, ssEnd, ssName };
            };
            
            ['year', 'month', 'day', 'hour'].forEach(p => { 
                state.calc.afflictions[p] = getAffliction(state.calc.timeBazi[p]); 
            });

            // ปีของดาวจรรายปี เปลี่ยนที่เวลา 立春 จริง (ตรงกับเสาปีของ Lunar.js)
            const actualYear = state.calc.timeBazi.solarYear;

            let centerStar = 3 - ((actualYear - 2024) % 9); 
            while (centerStar <= 0) centerStar += 9;
            while (centerStar > 9) centerStar -= 9;

            const luoShuPath = ['Center', 'NW', 'W', 'NE', 'S', 'N', 'SW', 'E', 'SE']; 
            const yearStars = {};
            let currentStar = centerStar;
            luoShuPath.forEach(dir => { 
                if (dir !== 'Center') yearStars[dir] = currentStar; 
                currentStar = currentStar === 9 ? 1 : currentStar + 1; 
            });
            state.calc.stars = { year: yearStars, center: centerStar };

            updateUI(); 
            updateStatusBadge(); 
            updateAdviceBox(state.currentDegree); 
            draw2DTexture();
        }

        // ===== Responsive: จัดขนาดจานให้พอดีจอทุกขนาด และบอกตำแหน่งให้ CSS วางกล่องรอบจาน =====
        // จอแนวตั้ง: จานกว้างเกือบเต็มจอ กล่ององศาอยู่เหนือจาน กล่องสถานะ/แถบเลื่อนอยู่ใต้จาน
        // จอแนวนอน (กว้าง ≥ 1.25 เท่าของสูง): จานสูงเกือบเต็มจอ กล่องย้ายไปไว้ซ้าย-ขวาของจาน
        const DIAL_WORLD_RADIUS = 5;
        let dialPx = 0;
        function onWindowResize() {
            const container = document.getElementById('canvas3dContainer');
            if(!container || container.clientWidth === 0) return;
            const width = container.clientWidth, height = container.clientHeight;
            const aspect = width / height;
            const side = aspect >= 1.25;
            document.body.classList.toggle('side-layout', side);

            if (side) {
                const sideMin = Math.min(460, Math.max(220, width * 0.24));
                dialPx = Math.min(height * 0.94, width - 2 * sideMin);
            } else {
                const reserve = Math.min(270, height * 0.24); // พื้นที่บน/ล่างสำหรับกล่ององศา คำเตือน และกล่องสถานะ
                dialPx = Math.min(width * 0.94, height - 2 * reserve);
            }
            dialPx = Math.max(dialPx, Math.min(width, height) * 0.5);

            /* จานหล่อแกอยู่กึ่งกลางจอ: ตั้งความสูงกล้องให้รัศมีจานเท่ากับ dialPx/2 พิกเซล */
            const fovRad = (camera.fov / 2) * (Math.PI / 180);
            const pxPerUnit = (dialPx / 2) / DIAL_WORLD_RADIUS;
            const camY = ((height / 2) / pxPerUnit) / Math.tan(fovRad);
            camera.aspect = aspect;
            camera.position.set(0, camY, 0);
            camera.lookAt(0, 0, 0);
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);

            const root = document.documentElement.style;
            const dialTop = height / 2 - (dialPx / 2) * 0.96; // ขอบวงองศา (0.96 ของรัศมี)
            root.setProperty('--deg-bottom', Math.min(height - dialTop + 14, height - 70) + 'px');
            root.setProperty('--side-w', Math.max(0, (width - dialPx) / 2) + 'px');
            const fab = document.getElementById('fabLeft');
            const fabBottom = fab ? fab.getBoundingClientRect().bottom : 170;
            root.setProperty('--side-top', (fabBottom + 14) + 'px');
        }
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 200));
        if (window.visualViewport) window.visualViewport.addEventListener('resize', onWindowResize);
        onWindowResize();

        function draw2DTexture() {
            const size = texSize; const cx = size / 2; const cy = size / 2;
            ctx.clearRect(0, 0, size, size);
            hasPulse = false;
            const rTicks = size * 0.48; const rBrn = size * 0.38; 
            const rDir = size * 0.28; const rStar = size * 0.16; const rTai = size * 0.08;

            ctx.save(); ctx.translate(cx, cy);
            
            const drawSeg = (rIn, rOut, sDeg, eDeg, fill, stroke, lWidth = 2) => {
                ctx.beginPath(); 
                ctx.arc(0, 0, rOut, (sDeg - 90) * Math.PI / 180, (eDeg - 90) * Math.PI / 180);
                ctx.arc(0, 0, rIn, (eDeg - 90) * Math.PI / 180, (sDeg - 90) * Math.PI / 180, true); 
                ctx.closePath();
                if (fill !== 'transparent') { ctx.fillStyle = fill; ctx.fill(); }
                if (stroke !== 'transparent') { ctx.strokeStyle = stroke; ctx.lineWidth = lWidth; ctx.stroke(); }
            };

        let targetDegree = 0; let displayDegree = 0;

        function lerpAngle(start, end, amount) {
            const diff = ((end - start + 540) % 360) - 180;
            return norm360(start + diff * amount);
        }
        function screenAngle() {
            if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
            return typeof window.orientation === 'number' ? window.orientation : 0;
        }

        //   ถ้าเอามาปนกัน ค่าจะสลับไปมาและหน้าปัดกระโดด
        let gotAbsoluteEvent = false; let lastHeadingAt = 0;
        function handleOrientation(event) {
            if (!state.isCompassActive) return;
            let heading = null;
            if (typeof event.webkitCompassHeading === 'number' && !isNaN(event.webkitCompassHeading)) {
                heading = event.webkitCompassHeading;
            } else if (event.type === 'deviceorientationabsolute') {
                gotAbsoluteEvent = true;
                if (event.alpha !== null) heading = 360 - event.alpha;
            } else if (event.absolute === true && !gotAbsoluteEvent && event.alpha !== null) {
                heading = 360 - event.alpha; // เบราว์เซอร์ที่ส่ง absolute มากับ deviceorientation
            }
            if (heading === null || isNaN(heading)) return;
            targetDegree = norm360(heading + screenAngle());
            lastHeadingAt = Date.now();
        }
        
        els.compassBtn.addEventListener('click', async () => {
            if (!state.isCompassActive) {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try { 
                        const permission = await DeviceOrientationEvent.requestPermission(); 
                        if (permission === 'granted') { 
                            window.addEventListener('deviceorientation', handleOrientation); 
                            startCompass(); 
                        } else { 
                            showToast("ต้องอนุญาตให้เข้าถึงเข็มทิศก่อนครับ"); 
                        } 
                    } catch (e) { showToast("ไม่สามารถเปิดเข็มทิศได้: " + e.message); }
                } else { 
                    window.addEventListener('deviceorientationabsolute', handleOrientation); 
                    window.addEventListener('deviceorientation', handleOrientation);
                    startCompass(); 
                }
            } else { stopCompass(); }
        });

        function startCompass() {

            if (luopanMesh && state.isCompassActive) { 
                displayDegree = lerpAngle(displayDegree, targetDegree, 0.15); 
                luopanMesh.rotation.z = displayDegree * (Math.PI / 180); 
                if(Math.abs(state.currentDegree - displayDegree) > 0.5) { 
                    updateAdviceBox(displayDegree); 
                    state.currentDegree = displayDegree; 
                } 
            }
            renderer.render(scene, camera);
        }

        calculateAll(); 
        animate();
    </script>
</body>
</html>
