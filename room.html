    <!-- เลขเวอร์ชัน: เปลี่ยนให้ตรงกับ version.json ทุกครั้งที่อัปเดต (ดู CLAUDE.md) -->

    <style>
        body { font-family: 'Prompt', sans-serif; background: #020617; color: #e2e8f0; margin: 0;
               padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
        .cn { font-family: 'STKaiti', 'KaiTi', 'Noto Serif TC', 'Songti TC', serif; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; }
        .btn { font-size: 13px; padding: 8px 12px; border-radius: 10px; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; }
        .btn-gold { background: #eab308; border-color: #eab308; color: #0f172a; font-weight: 600; }
        .fld { width: 100%; background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 9px 11px; color: #fff; font-size: 16px; }
        .chip { font-size: 12.5px; padding: 6px 11px; border-radius: 999px; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
        .chip[aria-pressed="true"] { background: #eab308; border-color: #eab308; color: #0f172a; font-weight: 600; }
        .cell { border-radius: 12px; border: 1.5px solid #334155; background: #0b1220; min-height: 88px; padding: 6px 4px; text-align: center; position: relative; }
        .cell.hl { box-shadow: 0 0 0 3px #facc15; }
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #facc15; outline-offset: 2px; }
    </style>
</head>
<body>
    <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800" style="padding-top: env(safe-area-inset-top, 0px)">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center gap-2">
            <a href="index.html" data-back class="text-[12px] text-sky-300 border border-slate-700 rounded-full px-3 py-1 hover:bg-slate-800">← เข็มทิศ</a>
            <h1 class="text-lg font-bold text-yellow-400 flex-1 truncate">🚪 ผังรายห้อง</h1>
            <span data-pro-only class="text-[11px] text-sky-200 bg-sky-900/70 border border-sky-700 rounded-full px-2.5 py-1 max-w-[30vw] truncate" data-house-name></span>
        </div>
    </header>
    <main class="max-w-xl mx-auto p-3 space-y-3 pb-12">
        <p class="text-[13px] text-slate-400 px-1">ทุกห้องมี 8 ทิศของตัวเองรอบจุดกลางห้อง <span class="cn">(小太極)</span> เลือกห้อง บอกทิศของประตูห้อง แล้วดูว่ามุมไหนควรวางเตียง โต๊ะ น้ำ หรือของแก้</p>
        <div id="noHouse" class="hidden card p-4 text-[13px] text-amber-200">ต้องบันทึกทิศบ้านก่อน เพราะผังห้องใช้ดาวเหินของบ้าน · <a href="home.html" class="underline text-sky-300">ใส่ข้อมูลบ้าน</a></div>
        <div id="roomBar" class="flex flex-wrap gap-1.5"></div>
        <div id="detail"></div>
    </main>
    <script src="js/data.js?v=2026.10.22-11"></script>
    <script src="js/calc.js?v=2026.10.22-11"></script>
    <script src="js/magdec.js?v=2026.10.22-11"></script>
    <script src="js/fs-core.js?v=2026.10.22-11"></script>

    <script src="js/simple-core.js?v=2026.10.22-11"></script>
    <script src="js/furniture-core.js?v=2026.10.22-11"></script>
    <script src="js/heading.js?v=2026.10.22-11"></script>
    <script src="js/room-core.js?v=2026.10.22-11"></script>
    <script src="js/room.js?v=2026.10.22-11"></script>
